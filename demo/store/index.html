<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>المتجر</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b1512;--card:#12211c;--line:#1f3a31;--gold:#E7C46A;--fg:#eaf2ee;--mut:#93a8a0}
body{background:var(--bg);color:var(--fg);font-family:"Segoe UI",Tahoma,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:9;background:rgba(11,21,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding:12px 0}
.hd img{width:46px;height:46px;border-radius:12px}
.hd h1{font-size:19px}
.hd p{font-size:12px;color:var(--mut)}
.hd .sp{flex:1}
.btn{background:var(--gold);color:#0b1512;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.hero{padding:26px 0 6px}
.hero h2{font-size:26px;margin-bottom:6px}
.hero p{color:var(--mut);font-size:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin:18px 0 34px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.2s}
.cat:hover{border-color:var(--gold);transform:translateY(-2px)}
.cat img{width:100%;height:150px;object-fit:cover;display:block}
.cat .b{padding:12px 14px}
.cat .b b{font-size:16px}
.cat .b span{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card .ph{height:190px;background:#fff;display:flex;align-items:center;justify-content:center}
.card .ph img{max-width:100%;max-height:100%;object-fit:contain}
.card .b{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .b b{font-size:15px}
.card .b small{color:var(--mut);font-size:12px}
.price{margin-top:auto;color:var(--gold);font-weight:800;font-size:16px}
.tag{display:inline-block;background:rgba(231,196,106,.15);color:var(--gold);font-size:11px;border-radius:6px;padding:2px 7px;width:max-content}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.tools input,.tools select{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:14px;min-width:180px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.chip.on{background:var(--gold);color:#0b1512;border-color:var(--gold);font-weight:700}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--mut);font-size:12px}
footer a{color:var(--gold)}
.empty{padding:40px 0;color:var(--mut);text-align:center}
</style></head><body>
<header><div class="wrap hd">
  <img id="logo" src="logo.svg" alt="logo"/>
  <div><h1 id="nm">المتجر</h1><p id="tg"></p></div>
  <div class="sp"></div>
  <a class="btn ghost" id="adminLink" href="admin/">لوحة الإدارة</a>
</div></header>
<main class="wrap">
  <section class="hero"><h2 id="viewTitle"></h2><p id="viewSub"></p></section>
  <div class="tools" id="tools" hidden>
    <input id="q" placeholder="ابحث عن منتج…"/>
    <select id="sort"><option value="">الأحدث</option><option value="asc">السعر: الأقل أولاً</option><option value="desc">السعر: الأعلى أولاً</option></select>
  </div>
  <div class="chips" id="chips" hidden></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>لا توجد منتجات مطابقة.</p>
</main>
<footer><div class="wrap" id="cr"></div></footer>
<script>
const $ = (s) => document.querySelector(s);
const money = (n) => Number(n).toLocaleString("en-US") + " ج.س";
let DATA = null, state = { cat: "", q: "", sort: "", group: "" };

async function boot() {
  try {
    const r = await fetch("data.json?ts=" + Date.now());
    DATA = await r.json();
  } catch (e) {
    $("#grid").innerHTML = '<p class="empty">تعذر تحميل بيانات المتجر.</p>';
    return;
  }
  $("#nm").textContent = DATA.store.name || "المتجر";
  $("#tg").textContent = DATA.store.tagline || "";
  if (DATA.store.logo) $("#logo").src = DATA.store.logo;
  document.title = DATA.store.name || "المتجر";
  route();
}

function route() {
  const hash = (location.hash || "").replace("#", "");
  state.cat = DATA.categories.some(c => c.id === hash) ? hash : "";
  render();
  window.scrollTo({ top: 0 });
}

function render() {
  const grid = $("#grid"), chips = $("#chips"), tools = $("#tools");
  if (!state.cat) {
    $("#viewTitle").textContent = "الفئات";
    $("#viewSub").textContent = DATA.categories.length + " فئة · " +
      DATA.categories.reduce((n, c) => n + c.products.length, 0) + " منتجاً";
    chips.hidden = true; tools.hidden = true;
    grid.innerHTML = DATA.categories.map(c => {
      const cover = (c.products.find(p => p.image) || {}).image || "";
      return `<a class="cat" href="#${c.id}">
        ${cover ? `<img src="${cover}" alt="${c.name}" loading="lazy"/>` : ""}
        <div class="b"><b>${c.icon || ""} ${c.name}</b>
        <span>${c.products.length} منتجاً</span></div></a>`;
    }).join("");
    return;
  }
  const cat = DATA.categories.find(c => c.id === state.cat);
  $("#viewTitle").textContent = (cat.icon || "") + " " + cat.name;
  $("#viewSub").textContent = cat.tagline || "";
  tools.hidden = false;

  const groups = [...new Set(cat.products.map(p => p.group).filter(Boolean))];
  if (groups.length) {
    chips.hidden = false;
    chips.innerHTML = [`<span class="chip ${state.group ? "" : "on"}" data-g="">الكل</span>`]
      .concat(groups.map(g => `<span class="chip ${state.group === g ? "on" : ""}" data-g="${g}">${g}</span>`))
      .join("");
  } else { chips.hidden = true; state.group = ""; }

  let list = cat.products.filter(p => !state.group || p.group === state.group);
  if (state.q) {
    const q = state.q.toLowerCase();
    list = list.filter(p => (p.name + " " + (p.specs || "")).toLowerCase().includes(q));
  }
  if (state.sort === "asc") list = [...list].sort((a, b) => a.price - b.price);
  if (state.sort === "desc") list = [...list].sort((a, b) => b.price - a.price);

  $("#empty").hidden = list.length > 0;
  grid.innerHTML = list.map(p => `
    <div class="card">
      <div class="ph">${p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy"/>` : ""}</div>
      <div class="b">
        ${p.tag ? `<span class="tag">${p.tag}</span>` : ""}
        <b>${p.name}</b><small>${p.specs || ""}</small>
        <span class="price">${money(p.price)}</span>
      </div>
    </div>`).join("");
}

$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("#chips").addEventListener("click", e => {
  const chip = e.target.closest(".chip"); if (!chip) return;
  state.group = chip.dataset.g; render();
});
window.addEventListener("hashchange", route);
boot();
</script></body></html>
